<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phil Mitchell Radio Hour - Flashlight Sync</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        const firebaseConfig = {
            apiKey: "AIzaSyC_LXTw9P9EipLpXGguxh1bA0DT_dXFboQ",
            authDomain: "phil-mitchell-s-holy-light.firebaseapp.com",
            databaseURL: "https://phil-mitchell-s-holy-light-default-rtdb.firebaseio.com",
            projectId: "phil-mitchell-s-holy-light",
            storageBucket: "phil-mitchell-s-holy-light.firebasestorage.app",
            messagingSenderId: "269027793355",
            appId: "1:269027793355:web:ca5285d2f3e0bb406e3e4e"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbOnDisconnect = onDisconnect;
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cinzel', serif; background: #000; color: #fff; }
        .rapture-bg { background: radial-gradient(ellipse at center, #4a0e0e 0%, #1a0000 50%, #000000 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 700px; width: 100%; padding: 20px; }
        h1, h2 { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); letter-spacing: 0.15em; text-transform: uppercase; }
        .btn { background: linear-gradient(135deg, #8b0000, #4a0000); border: 2px solid rgba(139, 0, 139, 0.5); color: #fff; padding: 20px; font-family: 'Cinzel', serif; font-size: 16px; cursor: pointer; border-radius: 8px; width: 100%; margin: 10px 0; transition: all 0.3s ease; }
        .btn:hover { border-color: rgba(139, 0, 139, 0.8); box-shadow: 0 0 30px rgba(139, 0, 139, 0.6); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .counter { background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(0, 255, 100, 0.3); border-radius: 6px; padding: 20px; text-align: center; margin: 20px 0; }
        .counter-num { font-size: 48px; color: #00ff64; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(139, 0, 139, 0.3); color: #fff; border-radius: 4px; font-family: 'Cinzel', serif; }
        input:focus, select:focus { outline: none; border-color: rgba(139, 0, 139, 0.7); box-shadow: 0 0 20px rgba(139, 0, 139, 0.3); }
        .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .preset-btn { background: rgba(139, 0, 0, 0.2); border: 2px solid rgba(139, 0, 139, 0.3); color: #fff; padding: 10px; border-radius: 4px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 11px; }
        .preset-btn.active { background: rgba(139, 0, 139, 0.3); border-color: rgba(139, 0, 139, 0.7); }
        .preset-btn.blackout { background: rgba(0, 0, 0, 0.5); border-color: rgba(255, 0, 0, 0.5); }
        .preset-btn.blackout.active { background: rgba(0, 0, 0, 0.8); border-color: rgba(255, 0, 0, 0.8); }
        .step { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(139, 0, 139, 0.3); border-radius: 6px; padding: 15px; margin: 10px 0; }
        .status { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 12px; margin: 20px 0; }
        .status.idle { background: rgba(100, 100, 100, 0.3); }
        .status.running { background: rgba(139, 0, 139, 0.4); animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 30px rgba(139, 0, 139, 0.8); } 50% { box-shadow: 0 0 50px rgba(139, 0, 139, 1); } }
    </style>
</head>
<body>
<div id="app" class="rapture-bg">
    <div class="container" style="text-align: center;">
        <p>Loading...</p>
    </div>
</div>

<script>
const PRESETS = {
    blackout: { on: 'blackout', off: 0, label: 'BLACKOUT' },
    solid: { on: 'solid', off: 0, label: 'Solid Light' },
    gentle: { on: 1000, off: 1500, label: 'Gentle' },
    slow: { on: 800, off: 1200, label: 'Slow' },
    medium: { on: 500, off: 500, label: 'Medium' },
    fast: { on: 200, off: 300, label: 'Fast' },
    rapid: { on: 100, off: 150, label: 'Rapid' },
    strobe: { on: 50, off: 100, label: 'Strobe' },
    heartbeat: { on: 300, off: 700, label: 'Heartbeat' },
    flicker: { on: 150, off: 200, label: 'Flicker' },
    chaotic: { on: 'r', off: 'r', label: 'Chaotic' }
};

let state = {
    mode: 'choose',
    connected: false,
    audienceCount: 0,
    sequences: [],
    savedSequences: [],
    isRunning: false,
    track: null,
    isFlashing: false,
    password: '',
    isAuthenticated: false,
    activeTab: 'build',
    sequenceName: ''
};

// Load saved sequences from Firebase
setTimeout(() => {
    if (window.db) {
        state.connected = true;
        
        // Load sequences from Firebase
        window.dbOnValue(window.dbRef(window.db, 'savedSequences'), (snap) => {
            if (snap.exists()) {
                state.savedSequences = Object.values(snap.val());
            }
            render();
        });
        
        window.dbOnValue(window.dbRef(window.db, 'audience'), (snap) => {
            state.audienceCount = snap.exists() ? Object.keys(snap.val()).length : 0;
            render();
        });
        
        window.dbOnValue(window.dbRef(window.db, 'command'), (snap) => {
            if (snap.exists()) {
                const cmd = snap.val();
                if (state.mode === 'audience' && state.track) {
                    if (cmd.t === 'seq') execSeq(cmd.s);
                    else if (cmd.t === 'stop') ctrlFlash(false);
                }
            }
        });
        
        render();
    }
}, 1000);

async function reqFlash() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        state.track = stream.getVideoTracks()[0];
        const id = 'a' + Date.now();
        window.dbSet(window.dbRef(window.db, `audience/${id}`), { j: Date.now() });
        window.dbOnDisconnect(window.dbRef(window.db, `audience/${id}`)).remove();
        render();
    } catch (e) {
        alert('Camera permission needed');
    }
}

async function ctrlFlash(on) {
    if (!state.track) return;
    try {
        await state.track.applyConstraints({ advanced: [{ torch: on }] });
        state.isFlashing = on;
        render();
    } catch (e) {}
}

async function execSeq(sq) {
    const p = () => {
        const r = Math.random();
        if (sq.loc === 'all') return true;
        if (sq.loc === 'random-50') return r < 0.5;
        if (sq.loc === 'random-25') return r < 0.25;
        return true;
    };
    if (!p()) return;
    if (sq.loc === 'wave') await new Promise(r => setTimeout(r, Math.random() * 3000));
    
    const pr = PRESETS[sq.preset];
    
    // BLACKOUT - turn lights OFF
    if (pr.on === 'blackout') {
        await ctrlFlash(false);
        await new Promise(r => setTimeout(r, sq.dur * 1000));
        return;
    }
    
    // SOLID LIGHT - turn lights ON
    if (pr.on === 'solid') {
        await ctrlFlash(true);
        await new Promise(r => setTimeout(r, sq.dur * 1000));
        await ctrlFlash(false);
        return;
    }
    
    // Regular strobing patterns
    const dur = sq.dur * 1000;
    const end = Date.now() + dur;
    while (Date.now() < end) {
        const onT = pr.on === 'r' ? Math.random() * 300 + 50 : pr.on;
        const offT = pr.off === 'r' ? Math.random() * 300 + 50 : pr.off;
        await ctrlFlash(true);
        await new Promise(r => setTimeout(r, onT));
        await ctrlFlash(false);
        await new Promise(r => setTimeout(r, offT));
    }
    await ctrlFlash(false);
}

function sendCommand(cmd) {
    if (!window.db) return;
    window.dbSet(window.dbRef(window.db, 'command'), { ...cmd, ts: Date.now() });
}

function addSeq() { state.sequences.push({ id: Date.now(), preset: 'medium', loc: 'all', dur: 5 }); render(); }
function updateSeq(id, field, value) { const seq = state.sequences.find(s => s.id === id); if (seq) seq[field] = value; render(); }
function deleteSeq(id) { state.sequences = state.sequences.filter(s => s.id !== id); render(); }

function saveSeqs() { 
    if (!state.sequenceName.trim() || !state.sequences.length) { 
        alert('Need name & steps'); 
        return; 
    } 
    const n = { 
        id: Date.now(), 
        name: state.sequenceName.trim(), 
        steps: JSON.parse(JSON.stringify(state.sequences)) 
    }; 
    state.savedSequences.push(n);
    
    // SAVE TO FIREBASE
    const fbSeqs = {};
    state.savedSequences.forEach(seq => {
        fbSeqs[seq.id] = seq;
    });
    window.dbSet(window.dbRef(window.db, 'savedSequences'), fbSeqs);
    
    state.sequenceName = ''; 
    alert('Saved!'); 
    render(); 
}

function loadSeq(sv) { 
    state.sequences = JSON.parse(JSON.stringify(sv.steps)); 
    state.sequences.forEach(s => s.id = Date.now() + Math.random()); 
    state.activeTab = 'build'; 
    render(); 
}

function deleteSeqSaved(id) { 
    if (confirm('Delete?')) { 
        state.savedSequences = state.savedSequences.filter(s => s.id !== id);
        
        // DELETE FROM FIREBASE
        const fbSeqs = {};
        state.savedSequences.forEach(seq => {
            fbSeqs[seq.id] = seq;
        });
        window.dbSet(window.dbRef(window.db, 'savedSequences'), fbSeqs);
        
        render(); 
    } 
}

async function runSeqs() { 
    state.isRunning = true; 
    render(); 
    for (const s of state.sequences) { 
        if (!state.isRunning) break; 
        sendCommand({ t: 'seq', s }); 
        await new Promise(r => setTimeout(r, (s.dur + 1) * 1000)); 
    } 
    state.isRunning = false; 
    render(); 
}

async function runSavedSeq(sv) { 
    state.isRunning = true; 
    render(); 
    for (const s of sv.steps) { 
        if (!state.isRunning) break; 
        sendCommand({ t: 'seq', s }); 
        await new Promise(r => setTimeout(r, (s.dur + 1) * 1000)); 
    } 
    state.isRunning = false; 
    render(); 
}

function stopSeq() { 
    state.isRunning = false; 
    sendCommand({ t: 'stop' }); 
    render(); 
}

function setState(key, value) { 
    state[key] = value; 
    render(); 
}

function render() {
    const app = document.getElementById('app');
    if (!state.connected) { 
        app.innerHTML = '<div class="container" style="text-align:center"><p style="color:rgba(255,255,255,0.6)">CONNECTING...</p></div>'; 
        return; 
    }
    
    if (state.mode === 'choose') { 
        app.innerHTML = `<div class="container" style="text-align:center"><h1 style="font-size:48px;margin-bottom:10px">THE PHIL MITCHELL</h1><h2 style="font-size:36px">RADIO HOUR</h2><p style="color:#00ff64;margin:30px 0">🔴 LIVE • ${state.audienceCount} CONNECTED</p><button class="btn" onclick="setState('mode','audience')">JOIN CONGREGATION</button><button class="btn" onclick="setState('mode','control')">PREACHER CONTROLS</button></div>`; 
        return; 
    }
    
    if (state.mode === 'audience') { 
        if (!state.track) { 
            app.innerHTML = `<div class="container" style="text-align:center"><h1 style="font-size:32px;margin-bottom:20px">PREPARE FOR THE RAPTURE</h1><p style="color:rgba(255,255,255,0.7);margin-bottom:40px">Activate your flashlight</p><button class="btn" onclick="reqFlash()">RECEIVE SIGNAL</button><button class="btn" onclick="setState('mode','choose')">Return</button></div>`; 
        } else { 
            app.innerHTML = `<div class="container" style="text-align:center"><div style="width:150px;height:150px;margin:0 auto 40px;border-radius:50%;background:${state.isFlashing?'radial-gradient(circle,rgba(255,215,0,0.8),rgba(139,0,139,0.4))':'radial-gradient(circle,rgba(139,0,139,0.2),transparent)'};display:flex;align-items:center;justify-content:center;border:${state.isFlashing?'3px solid rgba(255,215,0,0.5)':'3px solid rgba(139,0,139,0.3)'};font-size:60px;transition:all 0.3s">⚡</div><div style="width:12px;height:12px;border-radius:50%;background:#00ff64;margin:0 auto 15px;box-shadow:0 0 10px rgba(0,255,100,0.5)"></div><h2 style="font-size:28px">CONNECTED</h2><p style="color:rgba(255,255,255,0.6)">Awaiting transmission...</p></div>`; 
        } 
        return; 
    }
    
    if (state.mode === 'control') { 
        if (!state.isAuthenticated) { 
            app.innerHTML = `<div class="container" style="text-align:center"><h1 style="font-size:24px;margin-bottom:40px">BROADCAST CONTROLS</h1><input type="password" placeholder="Password" value="${state.password}" onchange="setState('password',this.value)" onkeypress="if(event.key==='Enter'&&this.value==='rapture')setState('isAuthenticated',true)"/><button class="btn" onclick="state.password==='rapture'?setState('isAuthenticated',true):alert('Wrong')">BEGIN TRANSMISSION</button></div>`; 
        } else { 
            app.innerHTML = `<div class="container"><h1 style="text-align:center">BROADCAST CONTROLS</h1><span class="status ${state.isRunning?'running':'idle'}">${state.isRunning?'BROADCASTING':'IDLE'}</span><div class="counter"><div>👥</div><div class="counter-num">${state.audienceCount}</div><div style="color:rgba(255,255,255,0.6);font-size:12px">CONGREGATION</div></div><div style="display:flex;gap:10px;margin:20px 0;border-bottom:2px solid rgba(139,0,139,0.3)"><button style="background:none;border:none;color:${state.activeTab==='build'?'#fff':'rgba(255,255,255,0.5)'};border-bottom:${state.activeTab==='build'?'2px solid rgba(139,0,139,0.8)':'transparent'};cursor:pointer;font-family:Cinzel;padding:12px 20px;margin-bottom:-2px" onclick="setState('activeTab','build')">BUILD</button><button style="background:none;border:none;color:${state.activeTab==='library'?'#fff':'rgba(255,255,255,0.5)'};border-bottom:${state.activeTab==='library'?'2px solid rgba(139,0,139,0.8)':'transparent'};cursor:pointer;font-family:Cinzel;padding:12px 20px;margin-bottom:-2px" onclick="setState('activeTab','library')">LIBRARY</button></div>${state.activeTab === 'build' ? `<h2 style="font-size:18px;margin:20px 0">SEQUENCE BUILDER</h2><button class="btn" onclick="addSeq()" ${state.isRunning?'disabled':''}style="opacity:${state.isRunning?0.5:1};padding:10px">+ ADD STEP</button>${state.sequences.length === 0 ? '<p style="text-align:center;color:rgba(255,255,255,0.5)">No steps</p>' : state.sequences.map((sq,i) => `<div class="step"><div style="display:flex;justify-content:space-between;margin-bottom:15px"><span>STEP ${i+1}</span><button style="background:none;border:none;color:rgba(139,0,0,0.7);cursor:pointer;opacity:${state.isRunning?0.5:1}" onclick="deleteSeq(${sq.id})">🗑</button></div><label style="font-size:12px;display:block;margin-bottom:10px">Frequency</label><div class="preset-grid">${Object.entries(PRESETS).map(([k,p]) => `<button class="preset-btn ${k==='blackout'?'blackout':''} ${sq.preset===k?'active':''}" onclick="updateSeq(${sq.id},'preset','${k}')" ${state.isRunning?'disabled':''}>${p.label}</button>`).join('')}</div><label style="font-size:12px;display:block;margin:15px 0 8px">Location</label><select onchange="updateSeq(${sq.id},'loc',this.value)" ${state.isRunning?'disabled':''}><option value="all" ${sq.loc==='all'?'selected':''}>All</option><option value="wave" ${sq.loc==='wave'?'selected':''}>Wave</option><option value="random-50" ${sq.loc==='random-50'?'selected':''}>Random 50%</option><option value="random-25" ${sq.loc==='random-25'?'selected':''}>Random 25%</option></select><label style="font-size:12px;display:block;margin:15px 0 8px">Duration: ${sq.dur}s</label><input type="range" min="1" max="300" value="${sq.dur}" onchange="updateSeq(${sq.id},'dur',parseInt(this.value))" ${state.isRunning?'disabled':''} style="width:100%;margin:0"/></div>`).join('')}${state.sequences.length > 0 ? `<input type="text" placeholder="Sequence name" value="${state.sequenceName}" onchange="setState('sequenceName',this.value)" ${state.isRunning?'disabled':''}style="margin:15px 0"/><div style="display:grid;grid-template-columns:${state.isRunning?'2fr 1fr':'1fr 1fr'};gap:10px">${!state.isRunning ? `<button class="btn" onclick="saveSeqs()" style="padding:10px">💾 SAVE</button>` : ''}<button class="btn" onclick="${state.isRunning?'stopSeq()':'runSeqs()'}" style="padding:10px">${state.isRunning?'⏹ STOP':'▶ RUN'}</button></div>` : ''}` : `<h2 style="font-size:18px;margin:20px 0">SAVED SEQUENCES</h2>${state.savedSequences.length === 0 ? '<p style="text-align:center;color:rgba(255,255,255,0.5)">None</p>' : state.savedSequences.map(sv => `<div style="background:rgba(0,0,0,0.5);border:2px solid rgba(139,0,139,0.4);border-radius:6px;padding:15px;margin:10px 0"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div><h3 style="font-size:16px">${sv.name}</h3><p style="font-size:12px;color:rgba(255,255,255,0.5)">${sv.steps.length} steps</p></div><button style="background:none;border:none;color:rgba(139,0,0,0.7);cursor:pointer;opacity:${state.isRunning?0.5:1}" onclick="deleteSeqSaved(${sv.id})">🗑</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" onclick="loadSeq({id:${sv.id},name:'${sv.name}',steps:${JSON.stringify(sv.steps)}})" style="padding:10px" ${state.isRunning?'disabled':''}>LOAD</button><button class="btn" onclick="runSavedSeq({id:${sv.id},name:'${sv.name}',steps:${JSON.stringify(sv.steps)}})" style="padding:10px" ${state.isRunning?'disabled':''}>RUN</button></div></div>`).join('')}`}<button style="width:100%;margin-top:30px;padding:15px;background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-family:Cinzel;font-size:14px" onclick="setState('isAuthenticated',false);setState('mode','choose')">END TRANSMISSION</button></div>`; 
        } 
    }
}

render();
</script>
</body>
</html>
